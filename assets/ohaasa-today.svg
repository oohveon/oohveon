<title id="title">오늘의 오하아사 — 2026. 11. 27 운세 · 업데이트 대기</title>
<desc id="desc">2026-11-28. 꽃 아스키아트. 1위 물고기자리: 당신의 재능이 인정받을지도 몰라요. 2위 전갈자리: 원하던 것을 GET♪. 3위 염소자리: 새로운 사랑이 시작될 것 같은 예감♥. 4위 처녀자리: 앞으로의 목표를 찾게 되는 날. 5위 양자리: 고민이 해결되고 개운해짐. 6위 쌍둥이자리: 좋은 쇼핑을 할 수 있을 때. 7위 게자리: 유용한 정보를 얻을 수 있을지도 몰라요.. 8위 황소자리: 주변의 평가 하락…. 9위 천칭자리: 불만족을 느끼고 짜증이 남. 10위 물병자리: 망설임이 생길 것 같아요.. 11위 사자자리: 좋은 이야기에 주의가 필요함. 12위 사수자리: 소통이 서투르게</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="736" viewBox="0 0 1000 736" role="img" aria-labelledby="title desc">
<title id="title">오늘의 오하아사 — 오늘의 운세</title>
<desc id="desc">2026-11-25. 편지 아스키아트. 1위 양자리: 든든한 조력자가 나타날 것 같은 예감♪. 2위 쌍둥이자리: 즐거운 시간을 보낼 수 있을 것 같아요.. 3위 염소자리: 금전운이 좋아서 행복해요!. 4위 전갈자리: 소원을 들어줄지도 몰라요.. 5위 게자리: 주변으로부터 높은 평가를 받음. 6위 물고기자리: 뜻밖의 재회가 있는 날. 7위 처녀자리: 동료의 지원을 크게 기대함. 8위 물병자리: 집중력이 떨어지고 실수를 연발. 9위 천칭자리: 당신의 마음이 전해질 것 같아요. 10위 사자자리: 쓸데없는 고집을 부릴지도 몰라요.. 11위 사수자리: 이기적인 행동에 주의. 12위 황소자리: 기회를 놓쳐서 후회</desc>
